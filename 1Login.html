<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — АИС «ПЛАТЕЖИ И ПОЗИЦИИ ПО СЧЕТАМ НОСТРО»</title>
<style>
    * { box-sizing: border-box; }
    body {
        background: linear-gradient(135deg, #e6f0fa 0%, #c9ddf2 100%);
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .login-card {
        background: #fff;
        border-radius: 12px;
        padding: 30px 28px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 10px 30px rgba(0,43,92,0.25);
        border: 1px solid #b0c4de;
    }
    .login-card h1 {
        color: #002b5c;
        text-align: center;
        font-size: 18px;
        margin: 0 0 6px 0;
        line-height: 1.35;
    }
    .login-card .subtitle {
        text-align: center;
        font-size: 12px;
        color: #666;
        margin-bottom: 22px;
    }
    .input-group {
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .input-group label {
        font-weight: bold;
        font-size: 12px;
        color: #444;
    }
    .input-group input {
        padding: 9px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 13px;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-group input:focus {
        border-color: #0056b3;
        box-shadow: 0 0 5px rgba(0,86,179,0.3);
    }
    .input-group input.error {
        border-color: #dc3545 !important;
        background-color: #fff8f8;
    }
    .btn-login {
        width: 100%;
        padding: 10px;
        background-color: #0056b3;
        color: #fff;
        font-size: 14px;
        font-weight: bold;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 8px;
        transition: background-color 0.3s;
    }
    .btn-login:hover { background-color: #004494; }
    .btn-login:active { transform: scale(0.98); }

    .error-msg {
        display: none;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        border-radius: 5px;
        padding: 8px 10px;
        font-size: 12px;
        margin-bottom: 12px;
        text-align: center;
    }
    .error-msg.show { display: block; }
    .info-msg {
        display: none;
        background: #d1e7dd;
        color: #0f5132;
        border: 1px solid #badbcc;
        border-radius: 5px;
        padding: 8px 10px;
        font-size: 12px;
        margin-bottom: 12px;
        text-align: center;
    }
    .info-msg.show { display: block; }
    .btn-back {
        width: 100%;
        padding: 8px;
        background-color: #6c757d;
        color: #fff;
        font-size: 13px;
        font-weight: bold;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 8px;
    }
    .btn-back:hover { background-color: #5a6268; }
</style>
</head>
<body>

<div class="login-card">
    <h1>АИС «ПЛАТЕЖИ И ПОЗИЦИИ<br>ПО СЧЕТАМ НОСТРО»</h1>
    <div class="subtitle">Авторизация пользователя</div>

    <div id="errorMsg" class="error-msg"></div>
    <div id="infoMsg" class="info-msg"></div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="input-group">
            <label for="login">Логин (ФИО):</label>
            <input type="text" id="login" placeholder="Введите ФИО" autocomplete="username">
        </div>
        <div class="input-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Войти</button>
    </form>

    <form id="otpForm" style="display:none;" onsubmit="return handleOtpVerify(event)">
        <div class="input-group">
            <label for="otpCode">Код из Telegram:</label>
            <input type="text" id="otpCode" placeholder="Введите 6-значный код" maxlength="6" autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn-login">Подтвердить вход</button>
        <button type="button" class="btn-back" onclick="backToLogin()">Назад</button>
    </form>
</div>

<script>
    const MAIN_PAGE = '2HTML.html';
    let pendingFio = '';

    function showError(text) {
        const box = document.getElementById('errorMsg');
        box.textContent = text;
        box.classList.add('show');
        document.getElementById('infoMsg').classList.remove('show');
    }
    function showInfo(text) {
        const box = document.getElementById('infoMsg');
        box.textContent = text;
        box.classList.add('show');
        document.getElementById('errorMsg').classList.remove('show');
    }
    function clearError() {
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('login').classList.remove('error');
        document.getElementById('password').classList.remove('error');
        document.getElementById('otpCode').classList.remove('error');
    }

    function backToLogin() {
        pendingFio = '';
        document.getElementById('otpForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('otpCode').value = '';
        document.getElementById('infoMsg').classList.remove('show');
        clearError();
        document.getElementById('login').focus();
    }

    async function handleLogin(event) {
        event.preventDefault();
        clearError();

        const login = document.getElementById('login').value.trim();
        const password = document.getElementById('password').value;

        if (!login || !password) { showError('Заполните логин и пароль!'); return false; }

        try {
            const res = await fetch('api.php?action=login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fio: login, password: password })
            });
            const data = await res.json();
            if (!res.ok || !data.ok) {
                showError(data.error || 'Неверный логин или пароль!');
                return false;
            }
            if (data.requires_2fa) {
                pendingFio = data.fio || login;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('otpForm').style.display = 'block';
                showInfo(data.message || 'Код подтверждения отправлен в Telegram!');
                document.getElementById('otpCode').focus();
                return false;
            }
            sessionStorage.setItem('auth_user', JSON.stringify(data.user));
            window.location.href = MAIN_PAGE;
        } catch (err) {
            showError('Ошибка соединения с сервером (проверьте XAMPP Apache и PostgreSQL)');
        }
        return false;
    }

    async function handleOtpVerify(event) {
        event.preventDefault();
        clearError();

        const code = document.getElementById('otpCode').value.trim();
        if (!code) { showError('Введите код подтверждения из Telegram!'); return false; }

        try {
            const res = await fetch('api.php?action=verify_otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fio: pendingFio, code: code })
            });
            const data = await res.json();
            if (!res.ok || !data.ok) {
                showError(data.error || 'Неверный код подтверждения!');
                return false;
            }
            sessionStorage.setItem('auth_user', JSON.stringify(data.user));
            window.location.href = MAIN_PAGE;
        } catch (err) {
            showError('Ошибка соединения с сервером');
        }
        return false;
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login').focus();
        ['login', 'password', 'otpCode'].forEach(id => {
            document.getElementById(id).addEventListener('input', clearError);
        });
    });
</script>
</body>
</html>
